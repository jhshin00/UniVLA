model:
  image_channels: 3

  dim: 1024
  quant_dim: 32
  codebook_size: 8
  image_size: 224
  patch_size: 32
  spatial_depth: 8
  temporal_depth: 8
  dim_head: 64
  heads: 16
  code_seq_len: 4

  log_interval: 3000
  log_path: ./logs
  optimizer:
    class_path: torch.optim.AdamW
    init_args:
      lr: 1e-4
      weight_decay: 1e-2
  task_name: lapa_lam
  make_data_pair: &make_data_pair false
  stage: stage-1

data:
  data_root: /ssd4/libero_raw
  data_mix: libero_combined
  batch_size: 32
  resolution: 224
  num_frames: 16
  episodic: false
  shuffle_buffer_size: 10000
  image_aug: true

trainer:
  max_epochs: 5
  accelerator: gpu
  num_nodes: 1
  devices: 1
  strategy: ddp_find_unused_parameters_true
  precision: 16-mixed
  log_every_n_steps: 100
  gradient_clip_val: 0.1

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: ./logs/task_centric_lam_stage1
        verbose: true
        save_last: true
        save_top_k: -1
        every_n_train_steps: 3000

  logger:
    - class_path: lightning.pytorch.loggers.TensorBoardLogger
      init_args:
        save_dir: ./logs
        name: task_centric_lam_stage1